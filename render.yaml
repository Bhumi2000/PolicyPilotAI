# Render Blueprint - single-service deployment of the PolicyPilot AI prototype.
# FastAPI serves both the JSON API and the pre-built React app from frontend/dist,
# so the whole prototype is reachable at one URL (no CORS, no Node build on Render).
services:
  - type: web
    name: policypilot-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      # Live API calls require GEMINI_API_KEY to be set in Render's Environment.
      - key: ENABLE_DEMO_MODE
        value: "false"
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash"
      - key: GEMINI_FALLBACK_MODELS
        value: "gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.1-flash-lite"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEMPERATURE
        value: "0.2"
